<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Engine - SIWRAD Inspection</title>

    <link rel="stylesheet" href="css/camera.css">
</head>

<body>

<header class="header">
    <h1>Camera Engine</h1>
    <p>SIWRAD Inspection</p>
</header>

<main class="container">

    <div class="preview-box">
        <img id="previewImage" src="" alt="Preview Foto">
        <p id="previewText">Preview foto akan tampil di sini</p>
    </div>

    <div class="button-group">

        <button id="btnCamera">
            📷 Ambil Foto
        </button>

        <button id="btnPreview">
            🖼 Preview
        </button>

        <button id="btnSave">
            💾 Simpan
        </button>

        <button id="btnCancel">
            ❌ Batal
        </button>

    </div>

</main>

<script src="js/camera.js"></script>

</body>
</html>

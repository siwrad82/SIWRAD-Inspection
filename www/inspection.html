<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspeksi Baru - SIWRAD Inspection</title>

    <link rel="stylesheet" href="css/inspection.css">
</head>

<body>

<header class="header">
    <h1>Inspeksi Baru</h1>
    <p>SIWRAD Inspection</p>
</header>

<main class="container">

    <label>Nama Peralatan</label>
    <input type="text" id="equipment" placeholder="Masukkan nama peralatan">

    <label>Lokasi</label>
    <input type="text" id="location" placeholder="Masukkan lokasi">

    <label>Nomor Aset</label>
    <input type="text" id="assetNumber" placeholder="Masukkan nomor aset">

    <label>Nama Petugas</label>
    <input type="text" id="inspector" placeholder="Masukkan nama petugas">

    <label>Tanggal</label>
    <input type="date" id="date">

    <button id="btnStart">
    MULAI INSPEKSI
</button>

</main>

<script src="js/inspection.js"></script>

</body>
</html>
